<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Publicité partenaire simulée</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f9fafb;
      font-family: system-ui, sans-serif;
    }
    .ad-box {
      padding: 24px 32px;
      border-radius: 12px;
      border: 1px solid #374151;
      background: #1f2937;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="ad-box">
    <h1>Publicité simulée (test local)</h1>
    <p id="step-label">Chargement…</p>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const step = params.get('step') || '?';
    document.getElementById('step-label').textContent = 'Étape publicitaire n°' + step + ' — garde cet onglet actif >= 1,6 s';
  </script>
</body>
</html>
